name: Build and test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  security:
    name: Security gate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: python3 tools/security-policy.py --self-test
      - run: python3 tools/security-policy.py
      - run: python3 tools/security-download.py
      - name: Scan full Git history for secrets (redacted)
        run: work/security-tools/gitleaks git --log-opts="--all --full-history" --redact=100 --ignore-gitleaks-allow --no-banner --no-color .
      - name: Lint GitHub Actions
        run: work/security-tools/actionlint -color
  windows:
    needs: security
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python tools/check-source.py
      - run: node --check src/browser/zone-fullscreen.js
      - shell: pwsh
        run: |
          ./tools/build-windows.ps1
          ./tools/test-windows.ps1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: windows-test-results
          path: work/test-results/windows/
          if-no-files-found: error
      - name: Fetch original runtime and corresponding source
        shell: pwsh
        run: |
          ./tools/fetch-deskflow-windows.ps1
          python tools/fetch-deskflow-source.py
          $runtime=(Get-Content vendor/windows-runtime-path.txt -Raw).Trim()
          ./tools/build-windows.ps1 -IncludeRuntime -DeskflowRoot $runtime
      - name: Validate MSIX packaging (preview identity; never install)
        shell: pwsh
        run: ./tools/package-windows.ps1 -Preview
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-msix-validation-only
          path: dist/*-preview-x64.msix
          if-no-files-found: error
          retention-days: 7
  macos:
    needs: security
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 tools/check-source.py
      - name: Download verified original Deskflow
        run: |
          python3 tools/fetch-deskflow.py
          python3 tools/fetch-deskflow-source.py
      - name: Compile and test (isolated ad hoc build; never install)
        env:
          IOI_ALLOW_ADHOC: '1'
          IOI_DESKFLOW_APP: ${{ github.workspace }}/vendor/Deskflow.app
          IOI_DESK_DATA_ROOT: ${{ runner.temp }}/ioi-desk-tests
        run: sh tools/build-macos.sh
